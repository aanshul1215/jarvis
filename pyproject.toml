[build-system]
requires = ["setuptools>=75,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-trading-desk"
version = "0.1.0"
description = "Local-first multiasset research and paper-trading desk"
requires-python = ">=3.11"
dependencies = [
  "pyarrow==24.0.0",  # 2026-10-22: Windows Smart App Control blocks the 25.x/26.x DLLs on the owner's PC; 24.0.0 loads
  "alpaca-py==0.44.0",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
  "numpy==2.5.4",
  "scipy==1.18.1",  # optimisation and filters for the Phase 5 volatility, regime and risk models
  "tzdata==2026.5",  # zoneinfo time-zone data on Windows (New York time for SEC filings)
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
